schema_version: serenity_project_contract/v1.0.0
product:
  name: US Stock Daily Investment Research Agent
  owner_goal: >-
    Produce exactly one private post-close GPT-readable daily report that keeps
    accounting facts, modeled DCA, research signals and broker-confirmed events
    separate.
repository_roles:
  US-stock-daily-report-framework:
    visibility: public
    role: canonical source framework
    contains: [code, synthetic_examples, tests, methodology]
  US-stock-daily-report:
    visibility_required: private
    role: owner deployment and historical operational repository
    rule: must never be treated as safe public history
non_negotiables:
  - no broker order endpoint
  - no automatic execution
  - no private holdings or reports in Git, Actions summary, or public artifacts
  - one user-visible daily report per date
  - missing data remains UNKNOWN, blocked, degraded, or stale; never neutral by default
  - social media cannot independently open, add, trim, or exit
  - political communications cannot independently open, add, trim, or exit
  - global narratives cannot independently open, add, trim, or exit
  - prediction-market prices are noisy forecasts, not objective probabilities
  - modeled DCA is never broker-confirmed execution
  - all point-in-time models must preserve first-observed timestamps
  - walk-forward training must end before every out-of-sample test block
  - Quora and search-only snippets have zero direct decision weight
  - factor residual calibration may never pool model versions
  - corporate actions may never auto-adjust the confirmed ledger
private_daily_plan:
  five_tickers_required: true
  base_amount_usd_each: 20
  tickers_loaded_from_private_config: true
  automatic_execution: false
  daily_research_refresh: true
  ibkr_flex_daily_refresh_required: false
  stale_broker_snapshot_blocks_active_add_or_open: true
advanced_models:
  political_communication_brief:
    implemented_library: true
    raw_mention_count_signal: false
    complete_policy_claim_extraction: true
    president_has_highest_actor_prior: true
    media_can_replace_primary_source: false
    decision_score_cap: 0.08
    independent_trade_trigger: false
  trump_policy_transmission_index:
    implemented_library: true
    decision_score_cap: 0.05
    independent_trade_trigger: false
  global_market_narratives:
    implemented_library: true
    sources:
      - major_international_media
      - korean_regional_media
      - issuer_primary_newsroom
      - reddit_community
      - quora_search_context
      - bounded_kol_search
    topics:
      - oil_supply
      - middle_east_escalation
      - shipping_disruption
      - memory_hbm_demand
      - memory_oversupply
      - semiconductor_export_controls
      - korea_semiconductor_policy
      - trade_tariff
      - china_demand
      - rates_inflation
    correlated_source_collapse: independence_group_x_topic
    quora_direct_weight: 0
    downside_risk_budget_cap: 0.10
    decision_score_range: [-0.04, 0.01]
    independent_trade_trigger: false
  walk_forward_factor_validation:
    implemented_library: true
    strict_train_before_test: true
    non_overlapping_oos_by_horizon: true
    training_only_standardization: true
    transaction_costs_required: true
    feature_version_isolation: true
    future_target_mutation_may_change_prior_prediction: false
    automatic_factor_quarantine: true
    broker_order_capability: false
  live_polymarket_sentiment:
    implemented_library: true
    decision_score_cap: 0.03
    conditions: [spread, liquidity, depth, time_to_resolution, calibration]
    objective_probability_claim: false
    order_capability: false
  polymarket_settlement_event_study:
    implemented_library: true
    freeze_before_resolution_hours: 24
    lookahead_permitted: false
  volatility_surface_and_tail_risk:
    implemented_library: true
    inputs: [VIX1D, VIX9D, VIX, VIX3M, VIX6M, VVIX, SKEW, options_chain]
    correlated_option_surface_group: true
    downside_only_risk_control: true
    independent_trade_trigger: false
  overnight_and_premarket_anomaly:
    implemented_library: true
    own_history_normalization_required: true
    futures_and_liquidity_confirmation: true
    second_user_facing_report: false
    independent_trade_trigger: false
  barra_public_proxy:
    implemented_library: true
    commercial_barra_claim: false
  kalman_dynamic_exposure:
    implemented_library: true
    disclosed_holding_claim: false
  brinson_fachler_and_carino:
    implemented_library: true
    accounting_reconciliation_required: true
    broker_order_capability: false
  constrained_asset_allocation:
    implemented_library: true
    turnover_and_cost_constraints: true
    tax_and_owner_gates_downstream: true
    broker_order_capability: false
  factor_residual_calibration:
    implemented_library: true
    factor_model_version_isolation: true
    cross_version_pooling: false
    automatic_weight_quarantine: true
  prediction_settlement_scheduler:
    implemented_library: true
    horizons: [1, 5, 20, 60]
    complete_close_path_required: true
    idempotent_callback_only: true
    broker_order_capability: false
  corporate_action_reconciliation:
    implemented_library: true
    primary_source_required: true
    automatic_adjustment: false
  manager_skill_and_fragility:
    implemented_library: true
    copy_trade_requires_fragility_gate: true
  social_heat:
    implemented_existing_framework: true
    xiaohongshu_execution_weight: 0
    combined_social_score_cap: 0.05
  ibkr_flex_readonly_reconciliation:
    implemented_library: true
    automatic_ledger_mutation: false
    broker_order_capability: false
operational_activation_gates:
  - repository_visibility_correct
  - private_config_outside_git_and_cloud_sync
  - accepted_close_live_trial_persisted
  - private_opening_attested_and_initialized
  - ibkr_flex_private_live_reconciliation_verified
  - receiver_exactly_once_or_lookup_verified
  - exactly_one_daily_automation_target_verified
  - one_end_to_end_live_report_delivered_and_replayed_without_duplicate
codex_handoff_order:
  - complete one live accepted-close and private report trial
  - connect the tested IBKR Flex adapter to the private ledger reconciliation queue
  - embed political, global, prediction, social, volatility, attribution, factor-validation, and allocation aggregates in the single private report
  - decouple daily research refresh from optional or stale-triggered IBKR Flex refresh
  - schedule exact-version prediction settlements
  - implement verified GPT receiver and local or private-GitHub fallback channel
  - add production-authorized source credentials and private snapshot persistence
  - connect corporate-action evidence to the owner-confirmation queue
acceptance:
  commands:
    - python -m compileall -q serenity_monitor run_pro_daily.py
    - pytest -q tests/test_pro_research_suite.py tests/test_ibkr_flex.py tests/test_political_and_live_polymarket.py tests/test_advanced_risk_attribution_allocation.py tests/test_global_narratives_and_factor_backtest.py tests/test_daily_research_enrichment.py
    - python run_pro_daily.py --config examples/pro_daily_config.example.yaml --out-dir out_pro_demo
  expected:
    - report_json_validates_schema
    - report_contains_hold_or_explicit_block
    - dca_is_non_executing
    - policy_and_social_cannot_independently_trade
    - political_claims_are_not_keyword_counts
    - global_headlines_are_collapsed_by_independence_group_and_topic
    - quora_context_has_zero_direct_weight
    - reddit_is_one_correlated_community_group
    - walk_forward_training_ends_before_test
    - future_target_mutation_does_not_change_prior_oos_prediction
    - factor_costs_are_deducted_and_weak_factors_are_quarantined
    - live_polymarket_is_liquidity_and_calibration_weighted
    - polymarket_uses_only_pre_embargo_probability_after_resolution
    - ibkr_flex_never_mutates_the_confirmed_ledger
    - option_surface_signals_are_not_double_counted
    - attribution_reconciles_to_active_return
    - allocation_respects_turnover_and_group_caps
    - factor_residuals_are_never_pooled_across_versions
    - corporate_actions_require_primary_evidence_and_owner_confirmation
    - public_examples_are_synthetic
