name: public-framework-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: public-framework-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-public-framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q .

      - name: Check public privacy boundary
        run: python scripts/check_public_privacy.py

      - name: Run tests
        run: pytest -q

      - name: Generate synthetic offline smoke report
        run: >-
          python run_report.py --mock --no-external
          --config config/portfolio.example.yaml
          --out-dir "$RUNNER_TEMP/report-smoke"
          --date 2026-01-02

      # Deliberately no schedule, live credentials, Actions summary, artifact
      # upload, or repository persistence in the public framework workflow.
