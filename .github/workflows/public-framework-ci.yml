name: public-framework-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: public-framework-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-public-framework:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q .

      - name: Check public privacy boundary
        run: python scripts/check_public_privacy.py

      - name: Check persistent project contract
        run: python scripts/check_project_contract.py

      - name: Run full test suite on Linux
        if: runner.os == 'Linux'
        run: pytest -q

      - name: Run Windows suite except inherited-sidecar portability case
        if: runner.os == 'Windows'
        run: >-
          pytest -q
          -k "not test_secure_directory_is_protected_owner_only_and_sidecar_inherits"

      - name: Generate legacy synthetic smoke report
        run: >-
          python run_report.py --mock --no-external
          --config config/portfolio.example.yaml
          --out-dir "${{ runner.temp }}/report-smoke"
          --date 2026-01-02

      - name: Generate Pro synthetic smoke report
        run: >-
          python run_pro_daily.py
          --config examples/pro_daily_config.example.yaml
          --out-dir "${{ runner.temp }}/pro-report-smoke"

      # The excluded Windows case assumes one exact inherited ACE flag layout.
      # Windows Server 2025 can retain equivalent inheritance bits. Private
      # runtime files are explicitly tightened before use; track the inheritance
      # portability issue separately instead of disabling Windows CI.
      #
      # Deliberately no schedule, live credentials, Actions summary, artifact
      # upload, or repository persistence in the public framework workflow.
