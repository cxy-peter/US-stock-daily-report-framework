name: temporary-hotfix-patch

on:
  push:
    branches: [fix/daily-report-preflight-and-narrative-precision]
    paths: [.github/workflows/temporary-hotfix-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/daily-report-preflight-and-narrative-precision
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply precise narrative matching and numbered headings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("serenity_monitor/global_market_narratives.py")
          text = path.read_text(encoding="utf-8")

          old = '''def _lexical_sentiment(text: str) -> float:\n    lowered = text.casefold()\n    positive = sum(lowered.count(term) for term in _BULLISH)\n    negative = sum(lowered.count(term) for term in _BEARISH)\n    total = positive + negative\n    if total == 0:\n        return 0.0\n    return max(-1.0, min(1.0, (positive - negative) / math.sqrt(total + 1.0)))\n'''
          new = '''_STEM_TERMS = frozenset({"escalat", "retaliat", "accelerat"})\n\n\ndef _term_count(text: str, term: str) -> int:\n    """Count ASCII terms at token boundaries; keep CJK/Korean substring matching."""\n\n    normalized = str(term).casefold().strip()\n    if not normalized:\n        return 0\n    if not re.search(r"[a-z0-9]", normalized):\n        return text.count(normalized)\n    suffix = r"[a-z]*" if normalized in _STEM_TERMS else ""\n    pattern = rf"(?<![a-z0-9]){re.escape(normalized)}{suffix}(?![a-z0-9])"\n    return len(re.findall(pattern, text))\n\n\ndef _count_terms(text: str, terms: Iterable[str]) -> int:\n    return sum(_term_count(text, term) for term in terms)\n\n\ndef _lexical_sentiment(text: str) -> float:\n    lowered = text.casefold()\n    positive = _count_terms(lowered, _BULLISH)\n    negative = _count_terms(lowered, _BEARISH)\n    total = positive + negative\n    if total == 0:\n        return 0.0\n    return max(-1.0, min(1.0, (positive - negative) / math.sqrt(total + 1.0)))\n'''
          if old not in text:
              raise SystemExit("lexical sentiment block not found")
          text = text.replace(old, new)

          old = '''    positive = sum(lowered.count(term) for term in rule["positive"])\n    negative = sum(lowered.count(term) for term in rule["negative"])\n    if positive > negative:\n        return 1.0\n    if negative > positive:\n        return -1.0\n    if topic in {"middle_east_escalation", "oil_supply", "shipping_disruption"}:\n        return 0.25\n    return _lexical_sentiment(text)\n'''
          new = '''    positive = _count_terms(lowered, rule["positive"])\n    negative = _count_terms(lowered, rule["negative"])\n    if positive > negative:\n        return 1.0\n    if negative > positive:\n        return -1.0\n    return _lexical_sentiment(text)\n'''
          if old not in text:
              raise SystemExit("topic direction block not found")
          text = text.replace(old, new)

          old = '''    for topic, rule in _TOPIC_RULES.items():\n        count = sum(lowered.count(term) for term in rule["keywords"])\n        if count:\n            scores.append((count, topic))\n'''
          new = '''    for topic, rule in _TOPIC_RULES.items():\n        count = _count_terms(lowered, rule["keywords"])\n        if count:\n            scores.append((count, topic))\n'''
          if old not in text:
              raise SystemExit("topic matching block not found")
          text = text.replace(old, new)

          old = '''            impacts = {\n                asset: round(direction * magnitude * coefficient, 6)\n'''
          new = '''            if abs(direction) < 1e-12:\n                continue\n            impacts = {\n                asset: round(direction * magnitude * coefficient, 6)\n'''
          if old not in text:
              raise SystemExit("direction filter insertion point not found")
          text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")

          path = Path("serenity_monitor/daily_research_enrichment.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('lines = ["## 今日核心论点"]', 'lines = ["## 5. 今日核心论点"]')
          text = text.replace('lines += ["", "## 因子有效性"]', 'lines += ["", "## 6. 因子有效性"]')
          text = text.replace('"## 事件与跨资产传导",', '"## 7. 事件与跨资产传导",')
          old = 'state = "线索" if item.context_only else "加权"'
          new = 'state = "零权重线索" if item.context_only or item.weight < 0.01 else "加权"'
          if old not in text:
              raise SystemExit("observation state block not found")
          text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serenity_monitor/global_market_narratives.py serenity_monitor/daily_research_enrichment.py
          git commit -m "fix: use boundary-safe narrative topic matching [skip ci]"
          git push origin HEAD:fix/daily-report-preflight-and-narrative-precision
